  <rect width="100" height="100" rx="22" fill="#1A9CF0" />
  <!-- Left pill column -->
  <rect x="15" y="12" width="28" height="76" rx="14" fill="white" />
  <!-- Right pill column -->
  <rect x="57" y="12" width="28" height="76" rx="14" fill="white" />
  <!-- Cut inner-top of left column -->
