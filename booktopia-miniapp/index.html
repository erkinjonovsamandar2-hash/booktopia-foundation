    <!--
      First-open splash.

      This is inline on purpose: it is painted from the HTML itself, before the
      JavaScript bundle is fetched or parsed, so it appears immediately instead
      of after a white gap. It costs no extra request and about 1KB.

      React replaces it the moment it mounts — createRoot clears #root — so it
      is never removed by a timer and can never outlast the app.

      Nothing here animates for the first 400ms. On a warm connection the app
      mounts before that, so the usual experience is the app appearing directly,
      not a splash flashing past.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #F4F7FA;
        font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #boot .shelf { display: flex; align-items: flex-end; gap: 5px; height: 92px; }
      #boot .shelf i {
        display: block;
        border-radius: 2px 3px 3px 2px;
        transform-origin: bottom center;
        box-shadow: inset -3px 0 0 rgba(255, 255, 255, 0.3);
        opacity: 0;
        animation: boot-in 1.6s cubic-bezier(0.34, 1.3, 0.64, 1) infinite;
        animation-delay: var(--d);
      }
      #boot .rule {
        width: 104px; height: 3px; border-radius: 3px;
        background: rgba(10, 25, 47, 0.10); margin-top: -14px;
      }
      /* On the light splash the wordmark stays in its own blue. */
      #boot .word { width: 148px; height: auto; }
      @keyframes boot-in {
        0%   { transform: translateY(14px) rotate(-8deg); opacity: 0; }
        22%  { transform: none; opacity: 1; }
        72%  { transform: none; opacity: 1; }
        100% { transform: none; opacity: 0.25; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .shelf i { animation: none; opacity: 1; }
      }
    </style>
  </head>
